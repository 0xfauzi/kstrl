lowlbl trust hot" data-edge="52" data-from="AutonomyLadder" data-to="StateDir" data-layer="trust"><text x="529.3" y="174.0" class="t1">autonomy.json</text></g></g><g data-layer="steps"><g class="step" data-edge="48"><circle cx="139.0" cy="253.0" r="8.5" fill="#E5A84F"/><text x="139.0" y="257.0" class="t0">1</text></g><g class="step" data-edge="67"><circle cx="571.0" cy="122.0" r="8.5" fill="#E5A84F"/><text x="571.0" y="126.0" class="t0">2</text></g><g class="step" data-edge="49"><circle cx="381.0" cy="112.0" r="8.5" fill="#E5A84F"/><text x="381.0" y="116.0" class="t0">3</text></g><g class="step" data-edge="50"><circle cx="367.0" cy="138.5" r="8.5" fill="#E5A84F"/><text x="367.0" y="142.5" class="t0">4</text></g><g class="step" data-edge="51"><circle cx="367.0" cy="196.0" r="8.5" fill="#E5A84F"/><text x="367.0" y="200.0" class="t0">5</text></g><g class="step" data-edge="52"><circle cx="469.0" cy="169.0" r="8.5" fill="#E5A84F"/><text x="469.0" y="173.0" class="t0">6</text></g></g><style>#map .t0{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:11.0px;font-weight:700;fill:#161310;text-anchor:middle}#map .t1{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12.0px;font-weight:500;fill:#B48EC9;text-anchor:middle;paint-order:stroke;stroke:#161310;stroke-width:4;stroke-linejoin:round}#map .t2{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12.0px;font-weight:500;fill:#DD9BBD;text-anchor:middle;paint-order:stroke;stroke:#161310;stroke-width:4;stroke-linejoin:round}#map .t3{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:12.0px;font-weight:600;fill:#A2967F;text-anchor:start;letter-spacing:.13em}#map .t4{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:13.0px;font-weight:600;fill:#ECE5D8;text-anchor:middle}#map .t5{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:11.0px;font-weight:400;fill:#A2967F;text-anchor:middle}#map .t6{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:13.0px;font-weight:600;fill:#C4B9A4;text-anchor:middle}</style></svg><rect x="40.0" y="572.2" width="18" height="18" rx="3" fill="#27221A" stroke="#E5A84F" stroke-width="1.5"/><text x="64.2" y="588.0" class="c2">acts in this step</text><rect x="293.9" y="572.2" width="18" height="18" rx="3" fill="#27221A" stroke="#82A7BA" stroke-width="1.5"/><text x="318.1" y="588.0" class="c2">measures this step</text><rect x="559.2" y="572.2" width="18" height="18" rx="3" fill="#27221A" stroke="#8A7D63" stroke-width="1.5"/><text x="583.4" y="588.0" class="c2">built</text><rect x="675.8" y="572.2" width="18" height="18" rx="3" fill="#2A2519" stroke="#D9B036" stroke-width="1.5"/><text x="700.0" y="588.0" class="c2">part built</text><rect x="40.0" y="606.2" width="18" height="18" rx="3" fill="#1A1713" stroke="#4A4237" stroke-width="1.5"/><text x="64.2" y="622.0" class="c2">planned</text><text x="40.0" y="656.0" class="c3">the number at the start of an edge is the step that traces it; a step</text><text x="40.0" y="684.0" class="c3">nothing measures says so</text><text x="70.0" y="728.0" class="c4">1</text><text x="86.0" y="728.0" class="c2">Every decisive run adds evidence at the current level: merged</text><text x="86.0" y="756.0" class="c2">components, clean merges, violations.</text><text x="70.0" y="790.0" class="c4">2</text><text x="86.0" y="790.0" class="c2">When the evidence meets the level&#x27;s entry criteria, you promote</text><text x="86.0" y="818.0" class="c2">with an acknowledgement; the ladder never promotes itself.</text><text x="70.0" y="852.0" class="c4">3</text><text x="86.0" y="852.0" class="c2">At the next run start the level becomes a permission bundle that</text><text x="86.0" y="880.0" class="c2">can only withhold: a higher level removes a gate, never adds a</text><text x="86.0" y="908.0" class="c2">power the level does not carry.</text><text x="70.0" y="942.0" class="c4">4</text><text x="86.0" y="942.0" class="c2">One policy violation demotes one level, immediately, with a</text><text x="86.0" y="970.0" class="c2">cooldown before re-promotion.</text><text x="70.0" y="1004.0" class="c4">5</text><text x="86.0" y="1004.0" class="c2">Planned: a measured regression in the reviewers, or a health</text><text x="86.0" y="1032.0" class="c2">breach in the run metrics, opens a decision for you and can demote</text><text x="86.0" y="1060.0" class="c2">(R10.11, R8.4).</text><text x="70.0" y="1094.0" class="c4">6</text><text x="86.0" y="1094.0" class="c2">All of this lives outside the repository. If the control directory</text><text x="86.0" y="1122.0" class="c2">is unreadable or inside the tree, the factory falls back to the</text><text x="86.0" y="1150.0" class="c2">lowest level.</text><text x="40.0" y="1204.0" class="c5">Generated by scripts/atlas/figures.py from docs/atlas/atlas.json at c720528;</text><text x="40.0" y="1230.0" class="c5">do not edit by hand.</text><style>.c0{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:40.0px;font-weight:600;fill:#ECE5D8;text-anchor:start}.c1{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:28.0px;font-weight:400;fill:#A2967F;text-anchor:start}.c2{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:22.0px;font-weight:400;fill:#C4B9A4;text-anchor:start}.c3{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:22.0px;font-weight:400;fill:#A2967F;text-anchor:start}.c4{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:22.0px;font-weight:700;fill:#E5A84F;text-anchor:end}.c5{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:20.0px;font-weight:400;fill:#A2967F;text-anchor:start}</style></svg>