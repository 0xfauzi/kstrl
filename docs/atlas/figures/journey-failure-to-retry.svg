><path d="M0,0 L8,4 L0,8 z" fill="#B7C27C"/></marker><marker id="map-m-change" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#E26D5A"/></marker><marker id="map-m-reach" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#E5A84F"/></marker></defs><style>#map .node.quiet{opacity:.42}#map .node.planned{opacity:.5}#map .node.planned.quiet{opacity:.3}#map .node.meas .node__box{stroke:#82A7BA;stroke-width:2.2}#map .node.acts .node__box{stroke:#E5A84F;stroke-width:2.4}#map .node__ring{display:none;fill:none;stroke:#82A7BA;stroke-width:1.6}#map .node.meas .node__ring{display:inline}#map .flow.planned{opacity:.35}#map .flowlbl.planned{opacity:.5}#map .flow.off,#map .flowlbl.off{display:none}#map .flow.hot{opacity:1;stroke-opacity:1;stroke-width:2.6}#map .flowlbl.hot{opacity:1}</style><rect x="8.0" y="74.0" width="162.0" height="256.0" rx="5" fill="none" stroke="#A2967F" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 4"/><text x="18.0" y="91.0" class="t3">BUILD</text><rect x="198.0" y="74.0" width="162.0" height="88.0" rx="5" fill="none" stroke="#A2967F" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 4"/><text x="208.0" y="91.0" class="t3">DECIDE</text><rect x="388.0" y="74.0" width="162.0" height="168.0" rx="5" fill="none" stroke="#A2967F" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 4"/><text x="398.0" y="91.0" class="t3">MEASURE</text><g data-layer="flow"><path id="map-f30" class="flow measure hot" data-edge="30" data-from="MechanicalVerifier" data-to="Findings" data-art="check results" data-kind="measure" data-layer="measure" d="M 469.0 156.0 L 469.0 184.0" fill="none" stroke="#82A7BA" stroke-opacity="0.82" stroke-width="1.2" stroke-linecap="round" marker-end="url(#map-m-measure)"/><path id="map-f35" class="flow decide h