the error signal, built"><rect class="node__box" x="394.0" y="184.0" width="150.0" height="52.0" rx="4.0" fill="#27221A" stroke="#8A7D63" stroke-width="1.1"/><rect class="node__ring" x="397.0" y="187.0" width="144.0" height="46.0" rx="3.0"/><text x="469.0" y="201.0" class="t4">Findings</text><line x1="395.0" y1="207.0" x2="543.0" y2="207.0" stroke="#8A7D63" stroke-opacity=".45" stroke-width="1"/><g data-layer="job"><text x="469.0" y="220.0" class="t5">the error signal</text></g></g><g class="node built acts" data-id="Pipeline" data-kind="component" data-state="built" data-region="decide" role="button" tabindex="0" aria-label="Pipeline, the decision per component, built"><rect class="node__box" x="204.0" y="100.0" width="150.0" height="56.0" rx="4.0" fill="#27221A" stroke="#8A7D63" stroke-width="1.1"/><rect class="node__ring" x="207.0" y="103.0" width="144.0" height="50.0" rx="3.0"/><text x="279.0" y="117.0" class="t4">Pipeline</text><g data-layer="job"><text x="279.0" y="132.0" class="t5">the decision per component</text></g></g><g data-layer="flow"><g class="flowlbl measure hot" data-edge="30" data-from="MechanicalVerifier" data-to="Findings" data-layer="measure"><text x="529.3" y="174.0" class="t1">check results</text></g><g class="flowlbl decide hot" data-edge="35" data-from="Findings" data-to="Pipeline" data-layer="feedback"><text x="361.5" y="172.0" class="t2">the error signal</text></g><g class="flowlbl decide hot" data-edge="36" data-from="Pipeline" data-to="RetryContext" data-layer="feedback"><text x="186.1" y="94.0" class="t2">retry</text></g><g class="flowlbl build hot" data-edge="15" data-from="RetryContext" data-to="EngineerLoop" data-layer="feedback"><text x="192.5" y="172.0" class="t2">failures from last attempt</text></g><g class="flowlbl build hot" data-edge="21" data-from="Breaker" data-to="EngineerLoop" data-layer="feedback"><text x="149.3" y="258.0" class="t2">stall verdict</text></g></g><g data-layer="steps"><g class="step" data-edge="30"><circle cx="469.0" cy="169.0" r="8.5" fill="#E5A84F"/><text x="469.0" y="173.0" class="t0">1</text></g><g class="step" data-edge="35"><circle cx="381.0" cy="194.0" r="8.5" fill="#E5A84F"/><text x="381.0" y="198.0" class="t0">2</text></g><g class="step" data-edge="36"><circle cx="191.0" cy="128.0" r="8.5" fill="#E5A84F"/><text x="191.0" y="132.0" class="t0">3</text></g><g class="step" data-edge="15"><circle cx="89.0" cy="165.0" r="8.5" fill="#E5A84F"/><text x="89.0" y="169.0" class="t0">4</text></g><g class="step" data-edge="21"><circle cx="89.0" cy="255.0" r="8.5" fill="#E5A84F"/><text x="89.0" y="259.0" class="t0">5</text></g></g><style>#map .t0{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:11.0px;font-weight:700;fill:#161310;text-anchor:middle}#map .t1{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12.0px;font-weight:500;fill:#82A7BA;text-anchor:middle;paint-order:stroke;stroke:#161310;stroke-width:4;stroke-linejoin:round}#map .t2{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12.0px;font-weight:500;fill:#E39A86;text-anchor:middle;paint-order:stroke;stroke:#161310;stroke-width:4;stroke-linejoin:round}#map .t3{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:12.0px;font-weight:600;fill:#A2967F;text-anchor:start;letter-spacing:.13em}#map .t4{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:13.0px;font-weight:600;fill:#ECE5D8;text-anchor:middle}#map .t5{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:11.0px;font-weight:400;fill:#A2967F;text-anchor:middle}</style></svg><rect x="40.0" y="572.2" width="18" height="18" rx="3" fill="#27221A" stroke="#E5A84F" stroke-width="1.5"/><text x="64.2" y="588.0" class="c2">acts in this step</text><rect x="293.9" y="572.2" width="18" height="18" rx="3" fill="#27221A" stroke="#82A7BA" stroke-width="1.5"/><text x="318.1" y="588.0" class="c2">measures this step</text><rect x="559.2" y="572.2" width="18" height="18" rx="3" fill="#27221A" stroke="#8A7D63" stroke-width="1.5"/><text x="583.4" y="588.0" class="c2">built</text><rect x="675.8" y="572.2" width="18" height="18" rx="3" fill="#2A2519" stroke="#D9B036" stroke-width="1.5"/><text x="700.0" y="588.0" class="c2">part built</text><rect x="40.0" y="606.2" width="18" height="18" rx="3" fill="#1A1713" stroke="#4A4237" stroke-width="1.5"/><text x="64.2" y="622.0" class="c2">planned</text><text x="40.0" y="656.0" class="c3">the number at the start of an edge is the step that traces it; a step</text><text x="40.0" y="684.0" class="c3">nothing measures says so</text><text x="70.0" y="728.0" class="c4">1</text><text x="86.0" y="728.0" class="c2">A check fails. Its output is parsed into a finding with the file,</text><text x="86.0" y="756.0" class="c2">the line, the source context and a hint.</text><text x="70.0" y="790.0" class="c4">2</text><text x="86.0" y="790.0" class="c2">The pipeline reads the finding and, with retries left, decides to</text><text x="86.0" y="818.0" class="c2">try again.</text><text x="70.0" y="852.0" class="c4">3</text><text x="86.0" y="852.0" class="c2">The finding is written into the retry context. Today that context</text><text x="86.0" y="880.0" class="c2">only grows; after R10.2 it shows what is failing now and omits</text><text x="86.0" y="908.0" class="c2">what was fixed.</text><text x="70.0" y="942.0" class="c4">4</text><text x="86.0" y="942.0" class="c2">The next attempt starts with that context in front of the agent,</text><text x="86.0" y="970.0" class="c2">after the codebase context and before your standing instructions.</text><text x="70.0" y="1004.0" class="c4">5</text><text x="86.0" y="1004.0" class="c2">If the attempt changes nothing, the stall detector halts it rather</text><text x="86.0" y="1032.0" class="c2">than spending the rest of the budget.</text><text x="40.0" y="1086.0" class="c5">Generated by scripts/atlas/figures.py from docs/atlas/atlas.json at 33abeb4;</text><text x="40.0" y="1112.0" class="c5">do not edit by hand.</text><style>.c0{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:40.0px;font-weight:600;fill:#ECE5D8;text-anchor:start}.c1{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:28.0px;font-weight:400;fill:#A2967F;text-anchor:start}.c2{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:22.0px;font-weight:400;fill:#C4B9A4;text-anchor:start}.c3{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:22.0px;font-weight:400;fill:#A2967F;text-anchor:start}.c4{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:22.0px;font-weight:700;fill:#E5A84F;text-anchor:end}.c5{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:20.0px;font-weight:400;fill:#A2967F;text-anchor:start}</style></svg>