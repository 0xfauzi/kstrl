<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1490" viewBox="0 0 1500 1490" role="img" aria-label="The seven control loops of kstrl as nested bands"><rect x="0" y="0" width="1500" height="1490" rx="14" fill="#161310" stroke="#4A4237" stroke-width="2"/><text x="40.0" y="80.0" class="c0">The loops kstrl is built as</text><text x="40.0" y="118.0" class="c1">Innermost fastest. Each band: what acts, what measures it, and what it steers toward.</text><rect x="40" y="140" width="1420" height="1148" rx="18" fill="#1E1A15" stroke="#A2967F" stroke-width="2" stroke-dasharray="8 6"/><circle cx="79" cy="170" r="15" fill="#A2967F"/><text x="79.0" y="176.0" class="c2">7</text><text x="107.0" y="179.0" class="c3">operate</text><text x="223.2" y="179.0" class="c4">not built (R8.7, R8.8)</text><text x="1436.0" y="177.0" class="c5">not built</text><circle cx="1324" cy="170" r="8" fill="none" stroke="#A2967F" stroke-width="2.2" stroke-dasharray="3 3"/><text x="64.0" y="202.0" class="c6"><tspan fill="#A2967F" font-weight="400">acts  </tspan><tspan fill="#E5A84F" font-weight="500">the release driver</tspan></text><text x="64.0" y="228.0" class="c6"><tspan fill="#A2967F" font-weight="400">measures  </tspan><tspan fill="#82A7BA" font-weight="500">runtime error rates</tspan></text><text x="64.0" y="254.0" class="c6"><tspan fill="#A2967F" font-weight="400">toward  </tspan><tspan fill="#C4B9A4" font-weight="500">the service&#x27;s SLO</tspan></text><rect x="70" y="264" width="1360" height="1004" rx="18" fill="#1D1E19" stroke="#86C9A9" stroke-width="2"/><circle cx="109" cy="294" r="15" fill="#86C9A9"/><text x="109.0" y="300.0" class="c2">6</text><text x="137.0" y="303.0" class="c3">learn</text><text x="224.0" y="303.0" class="c4">weeks</text><text x="1406.0" y="301.0" class="c5">open; sensor part built</text><circle cx="1149" cy="294" r="8" fill="none" stroke="#E26D5A" stroke-width="2.2"/><text x="94.0" y="326.0" class="c6"><tspan fill="#A2967F" font-weight="400">acts  </tspan><tspan fill="#E5A84F" font-weight="500">playbook and prompt edits</tspan></text><text x="94.0" y="352.0" class="c6"><tspan fill="#A2967F" font-weight="400">measures  </tspan><tspan fill="#82A7BA" font-weight="500">attribution, calibration</tspan></text><text x="94.0" y="378.0" class="c6"><tspan fill="#A2967F" font-weight="400">toward  </tspan><tspan fill="#C4B9A4" font-weight="500">the harness&#x27;s own detection rates</tspan></text><rect x="100" y="388" width="1300" height="860" rx="18" fill="#1F1A1B" stroke="#B48EC9" stroke-width="2"/><circle cx="139" cy="418" r="15" fill="#B48EC9"/><text x="139.0" y="424.0" class="c2">5</text><text x="167.0" y="427.0" class="c3">trust</text><text x="254.0" y="427.0" class="c4">days</text><text x="1376.0" y="425.0" class="c5">closed, two inputs unwired</text><circle cx="1088" cy="418" r="8" fill="#D9B036" stroke="#D9B036" stroke-width="2.2"/><text x="124.0" y="450.0" class="c6"><tspan fill="#A2967F" font-weight="400">acts  </tspan><tspan fill="#E5A84F" font-weight="500">an autonomy level change</tspan></text><text x="124.0" y="476.0" class="c6"><tspan fill="#A2967F" font-weight="400">measures  </tspan><tspan fill="#82A7BA" font-weight="500">run outcomes</tspan></text><text x="124.0" y="502.0" class="c6"><tspan fill="#A2967F" font-weight="400">toward  </tspan><tspan fill="#C4B9A4" font-weight="500">the autonomy the evidence supports</tspan></text><rect x="130" y="512" width="1240" height="716" rx="18" fill="#221E1A" stroke="#D9CDB2" stroke-width="2"/><circle cx="169" cy="542" r="15" fill="#D9CDB2"/><text x="169.0" y="548.0" class="c2">4</text><text x="197.0" y="551.0" class="c3">intake</text><text x="298.6" y="551.0" class="c4">hours</text><text x="1346.0" y="549.0" class="c5">closed</text><circle cx="1266" cy="542" r="8" fill="#8FC470" stroke="#8FC470" stroke-width="2.2"/><text x="154.0" y="574.0" class="c6"><tspan fill="#A2967F" font-weight="400">acts  </tspan><tspan fill="#E5A84F" font-weight="500">queue admission</tspan></text><text x="154.0" y="600.0" class="c6"><tspan fill="#A2967F" font-weight="400">measures  </tspan><tspan fill="#82A7BA" font-weight="500">queue state, spend, inbox</tspan></text><text x="154.0" y="626.0" class="c6"><tspan fill="#A2967F" font-weight="400">toward  </tspan><tspan fill="#C4B9A4" font-weight="500">the queue drained</tspan></text><rect x="160" y="636" width="1180" height="572" rx="18" fill="#221E1A" stroke="#D9CDB2" stroke-width="2"/><circle cx="199" cy="666" r="15" fill="#D9CDB2"/><text x="199.0" y="672.0" class="c2">3</text><text x="227.0" y="675.0" class="c3">integrate</text><text x="372.4" y="675.0" class="c4">tens of minutes</text><text x="1316.0" y="673.0" class="c5">closed</text><circle cx="1236" cy="666" r="8" fill="#8FC470" stroke="#8FC470" stroke-width="2.2"/><text x="184.0" y="698.0" class="c6"><tspan fill="#A2967F" font-weight="400">acts  </tspan><tspan fill="#E5A84F" font-weight="500">schedule, merge, reset the breaker</tspan></text><text x="184.0" y="724.0" class="c6"><tspan fill="#A2967F" font-weight="400">measures  </tspan><tspan fill="#82A7BA" font-weight="500">contract tests</tspan></text><text x="184.0" y="750.0" class="c6"><tspan fill="#A2967F" font-weight="400">toward  </tspan><tspan fill="#C4B9A4" font-weight="500">the manifest DAG satisfied</tspan></text><rect x="190" y="760" width="1120" height="428" rx="18" fill="#1C1C1A" stroke="#82A7BA" stroke-width="2"/><circle cx="229" cy="790" r="15" fill="#82A7BA"/><text x="229.0" y="796.0" class="c2">2</text><text x="257.0" y="799.0" class="c3">accept</text><text x="358.6" y="799.0" class="c4">minutes</text><text x="1286.0" y="797.0" class="c5">closed, but winds up</text><circle cx="1060" cy="790" r="8" fill="#D9B036" stroke="#D9B036" stroke-width="2.2"/><text x="214.0" y="822.0" class="c6"><tspan fill="#A2967F" font-weight="400">acts  </tspan><tspan fill="#E5A84F" font-weight="500">a retry with context</tspan></text><text x="214.0" y="848.0" class="c6"><tspan fill="#A2967F" font-weight="400">measures  </tspan><tspan fill="#82A7BA" font-weight="500">verify, review, security</tspan></text><text x="214.0" y="874.0" class="c6"><tspan fill="#A2967F" font-weight="400">toward  </tspan><tspan fill="#C4B9A4" font-weight="500">the component PRD</tspan></text><rect x="220" y="884" width="1060" height="284" rx="18" fill="#221B17" stroke="#E39A86" stroke-width="2"/><circle cx="259" cy="914" r="15" fill="#E39A86"/><text x="259.0" y="920.0" class="c2">1</text><text x="287.0" y="923.0" class="c3">implement</text><text x="432.4" y="923.0" class="c4">seconds to minutes</text><text x="1256.0" y="921.0" class="c5">open</text><circle cx="1196" cy="914" r="8" fill="none" stroke="#E26D5A" stroke-width="2.2"/><text x="244.0" y="946.0" class="c6"><tspan fill="#A2967F" font-weight="400">acts  </tspan><tspan fill="#E5A84F" font-weight="500">the engineer agent</tspan></text><text x="244.0" y="972.0" class="c6"><tspan fill="#A2967F" font-weight="400">measures  </tspan><tspan fill="#82A7BA" font-weight="500">none: the breaker and the scope fence watch it, neither reads the code</tspan></text><text x="244.0" y="998.0" class="c6"><tspan fill="#A2967F" font-weight="400">toward  </tspan><tspan fill="#C4B9A4" font-weight="500">this story&#x27;s criteria</tspan></text><rect x="250" y="1008" width="1000" height="140" rx="10" fill="#1D1613" stroke="#6B4A3D" stroke-width="1.6"/><text x="274.0" y="1042.0" class="c7">THE PLANT</text><text x="274.0" y="1076.0" class="c8">The coding agent: a subprocess in its own process group, on a deadline,</text><text x="274.0" y="1102.0" class="c8">writing only its worktree. Every band around it acts on what it produced</text><text x="274.0" y="1128.0" class="c8">and measures it with something the agent did not write.</text><rect x="40.0" y="1317.3" width="21" height="21" rx="3" fill="#27221A" stroke="#E5A84F" stroke-width="1.5"/><text x="68.6" y="1336.0" class="c9">what acts</text><rect x="231.9" y="1317.3" width="21" height="21" rx="3" fill="#27221A" stroke="#82A7BA" stroke-width="1.5"/><text x="260.5" y="1336.0" class="c9">what measures</text><circle cx="486" cy="1329" r="8" fill="#8FC470" stroke="#8FC470" stroke-width="2.2"/><text x="501.8" y="1336.0" class="c9">closed</text><circle cx="633" cy="1329" r="8" fill="#D9B036" stroke="#D9B036" stroke-width="2.2"/><text x="648.6" y="1336.0" class="c9">closed, winds up or an input unwired</text><circle cx="1185" cy="1329" r="8" fill="none" stroke="#E26D5A" stroke-width="2.2"/><text x="1200.9" y="1336.0" class="c9">open</text><circle cx="1305" cy="1329" r="8" fill="none" stroke="#A2967F" stroke-width="2.2" stroke-dasharray="3 3"/><text x="1320.6" y="1336.0" class="c9">not built</text><text x="40.0" y="1374.0" class="c10">The band&#x27;s edge is the colour of the layer the loop lives in on the atlas.</text><text x="40.0" y="1426.0" class="c11">Generated by scripts/atlas/figures.py from docs/atlas/atlas.json at 407dc93; do not edit by hand.</text><text x="40.0" y="1456.0" class="c11">Loop table: docs/control-loop-design.md, section 2, The loop nest.</text><style>.c0{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:40.0px;font-weight:600;fill:#ECE5D8;text-anchor:start}.c1{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:28.0px;font-weight:400;fill:#A2967F;text-anchor:start}.c2{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#161310;text-anchor:middle}.c3{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:26.0px;font-weight:600;fill:#ECE5D8;text-anchor:start}.c4{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:20px;font-weight:400;fill:#A2967F;text-anchor:start}.c5{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:20px;font-weight:500;fill:#C4B9A4;text-anchor:end}.c6{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:19.0px;font-weight:400;fill:#C4B9A4;text-anchor:start}.c7{font-family:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;font-size:16px;font-weight:600;fill:#A2967F;text-anchor:start}.c8{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:19.0px;font-weight:500;fill:#ECE5D8;text-anchor:start}.c9{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:26.0px;font-weight:400;fill:#C4B9A4;text-anchor:start}.c10{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:26.0px;font-weight:400;fill:#A2967F;text-anchor:start}.c11{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:22.0px;font-weight:400;fill:#A2967F;text-anchor:start}</style></svg>