ss the daemon can kill on a deadline."},{"from":"Operator","to":"Architect","art":"spec","kind":"plan","layer":"operator","out":"gives the spec to","in":"plans for","say":"You hand the planner a spec; it is the only input you must write, and everything below measures against what it says."},{"from":"Architect","to":"Manifest","art":"component DAG","kind":"plan","layer":"work","out":"hands to","in":"receives from","say":"The planner splits the spec into components with dependencies and allowed paths, and halts instead of guessing when the spec has a blocker."},{"from":"Architect","to":"PRD","art":"stories + criteria","kind":"plan","layer":"work","out":"hands to","in":"receives from","say":"For each component the planner writes the stories and acceptance criteria that every later check will measure against: the set point."},{"from":"Manifest","to":"Scheduler","art":"ready components","kind":"decide","layer":"work","out":"hands to","in":"receives from","say":"The graph tells the scheduler which components are ready: those whose dependencies have actually merged, not merely finished."},{"from":"Scheduler","to":"Worktrees","art":"worktree per component","kind":"ship","layer":"work","out":"hands to","in":"receives from","say":"Each component gets its own working copy cut from the base branch, so parallel builds cannot see or damage each other."},{"from":"Feedforward","to":"EngineerLoop","art":"computed context","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"Before the agent writes a line, it is told the module map, public interfaces, import graph and conventions, computed from the tree with no model call."},{"from":"KnowledgeInjector","to":"EngineerLoop","art":"facts","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"Facts distilled from components built earlier are placed in the prompt so the agent inherits what was already learned instead of rediscovering it."},{"from":"RetryContext","to":"EngineerLoop","art":"failures from last attempt","kind":"build","layer":"feedback","out":"feeds back to","in":"is fed by","say":"What failed on the last attempt is handed to the agent as parsed failures with file, line and a fix hint; after R10.2, only what is failing now."},{"from":"EngineerLoop","to":"AgentAdapter","art":"prompt","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"The loop assembles one prompt and sends it to the agent through the adapter, once per iteration, up to the iteration cap."},{"from":"AgentAdapter","to":"CodingAgent","art":"stdin prompt","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"The adapter runs the agent as a subprocess in its own process group, on a deadline, and feeds the prompt on stdin."},{"from":"CodingAgent","to":"AgentAdapter","art":"stream + COMPLETE marker","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"The agent streams its output back; the adapter watches for the completion marker and scrapes token and cost figures from what the CLI reports."},{"from":"PRD","to":"EngineerLoop","art":"next failing story","kind":"build","layer":"feedback","out":"points","in":"targets","say":"The loop points the agent at the highest-priority story not yet marked done."},{"from":"EngineerLoop","to":"PRD","art":"passes flag (a claim)","kind":"build","layer":"feedback","out":"claims done in","in":"is claimed by","say":"The agent marks a story done by setting its flag; that flag is a claim, and after R10.3 the reviewer must confirm it before it counts."},{"from":"Breaker","to":"EngineerLoop","art":"stall verdict","kind":"build","layer":"feedback","out":"halts","in":"is halted by","say":"If several iterations in a row change nothing (same diff, same test signature), the breaker halts the loop instead of spending the remaining budget."},{"from":"PathGuard","to":"EngineerLoop","art":"scope verdict","kind":"build","layer":"feedback","out":"fences","in":"is fenced by","say":"Anything the agent changed outside its allowed paths is reverted or failed before the completion marker is honoured, so a claim of done cannot smuggle out-of-scope edits."},{"from":"EngineerLoop","to":"Pipeline","art":"LoopResult","kind":"decide","layer":"work","out":"hands to","in":"receives from","say":"When the loop ends, by completion, cap, breaker or timeout, its result goes to the pipeline, which decides what the measurement says."},{"from":"Pipeline","to":"MechanicalVerifier","art":"worktree + PRD","kind":"measure","layer":"measure","out":"submits to","in":"measures for","say":"The pipeline hands the finished working copy and its PRD to the checks that need no model: tests, typecheck, lint, scope, bad patterns."},{"from":"Pipeline","to":"Reviewer","art":"diff + criteria","kind":"measure","layer":"measure","out":"submits to","in":"measures for","say":"After the mechanical checks pass, the diff and the acceptance criteria go to an independent reviewer, by default from a different model family than the engineer."},{"from":"Pipeline","to":"SecurityReviewer","art":"diff","kind":"measure","layer":"measure","out":"submits to","in":"measures for","say":"The same diff goes to a security reviewer working from a threat taxonomy; off by default, blocking at a severity threshold in hard mode."},{"from":"PolicyEnvelope","to":"MechanicalVerifier","art":"envelope verdict","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"The written merge rules (denied paths, size caps, dependency and licence rules, secret patterns) are checked on the diff and lockfile as one of the mechanical checks."},{"from":"AdequacyGate","to":"MechanicalVerifier","art":"adequacy findings","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"The tests themselves are checked: deleted tests, added skips, lost assertions, and new test files that assert nothing falsifiable."},{"from":"FixturesOracle","to":"MechanicalVerifier","art":"fixture results","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Input and output pairs approved in the PRD are run sandboxed, outside the tree the agent can write, so a gamed test file cannot deselect them."},{"from":"MechanicalVerifier","to":"Findings","art":"check results","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Every failed check becomes a typed finding with a file, a line and a fix hint; a check that could not run leaves a finding saying so."},{"from":"Reviewer","to":"Findings","art":"criterion verdicts + concerns","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Each acceptance criterion gets a verdict, and each concern beyond the criteria (scope creep, weak tests, dead code) becomes a finding."},{"from":"SecurityReviewer","to":"Findings","art":"vulnerability findings","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Each vulnerability found becomes a finding mapped to an OWASP category, with severity."},{"from":"Findings","to":"Pipeline","art":"the error signal","kind":"decide","layer":"feedback","out":"decides","in":"reads","say":"The findings are the error signal: the pipeline reads them, not the agent's summary, to decide whether the component passed."},{"from":"Pipeline","to":"RetryContext","art":"retry","kind":"decide","layer":"feedback","out":"feeds back to","in":"is fed by","say":"When a gate fails and retries remain, the pipeline writes the findings into the context the next attempt will receive."},{"from":"Pipeline","to":"Distiller","art":"passed diff","kind":"ship","layer":"work","out":"hands to","in":"receives from","say":"Once every gate has passed and before the merge, the diff goes to the distiller so what was learned is captured while it is still the true delta."},{"from":"Distiller","to":"KnowledgeInjector","art":"durable facts","kind":"learn","layer":"learn","out":"writes facts for","in":"reads facts from","say":"Durable facts about the built arti ned by","say":"The recorded runs are what the replay tool feeds through the ladder's thresholds to say what would have fired, without changing anything."},{"from":"Pipeline","to":"EventBus","art":"typed events","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"Every phase start, verdict, retry and finding is emitted as a typed event; the event is the record, and sinks may not change control flow."},{"from":"Scheduler","to":"EventBus","art":"typed events","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"Run start, component scheduling, budget and completion are emitted as typed events alongside the pipeline's."},{"from":"EventBus","to":"ProgressLog","art":"v1 mirror","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"The older progress log is still written, byte-compatible, for anything that reads it."},{"from":"EventBus","to":"Reducer","art":"events.jsonl","kind":"observe","layer":"record","out":"is folded by","in":"folds","say":"The reducer folds the event file into the current state of the run; anything shown anywhere can be rebuilt from that file."},{"from":"Reducer","to":"Dashboard","art":"RunState","kind":"observe","layer":"record","out":"drives","in":"renders","say":"The terminal dashboard renders the reduced state live, attaches to a run from another terminal, and replays a finished one."},{"from":"Reducer","to":"CLI","art":"ks status","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"ks status prints the same reduced state for scripts and CI, with lower-bound markers wherever a cost figure is unreported."},{"from":"EventBus","to":"LinearMirror","art":"failures, budget halts","kind":"observe","layer":"record","out":"mirrors to","in":"mirrors","say":"Failures and budget halts are mirrored to the tracker as comments; the mirror is outbound only and can never fail a run."},{"from":"Dashboard","to":"Operator","art":"board, checkpoint var PAL = {"accent": "#E5A84F", "steel": "#82A7BA", "surface": "#1E1A15", "raised": "#27221A", "bg": "#161310", "ink": "#ECE5D8"};

function verbsFrom(cid, other){

function wheelExtent(w){

// ---- the panel -----------------------------------------------------------

  var say = (d.edges && d.edges.length) ? SAY_HINT : 'Nothing flows to or from this yet.';
  h += '<p class="atlas-f__say muted" data-say>' + esc(say) + '</p>';

  h += '</span>';

function peek(i, sticky){

      say.classList.remove('muted');

      s.classList.toggle('peek', +s.dataset.edge === i); });

      function(s){ s.classList.remove('peek'); });

}
