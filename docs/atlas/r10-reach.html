illed from components built earlier are placed in the prompt so the agent inherits what was already learned instead of rediscovering it."},{"from":"RetryContext","to":"EngineerLoop","art":"failures from last attempt","kind":"build","layer":"feedback","out":"feeds back to","in":"is fed by","say":"What failed on the last attempt is handed to the agent as parsed failures with file, line and a fix hint; after R10.2, only what is failing now."},{"from":"EngineerLoop","to":"AgentAdapter","art":"prompt","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"The loop assembles one prompt and sends it to the agent through the adapter, once per iteration, up to the iteration cap."},{"from":"AgentAdapter","to":"CodingAgent","art":"stdin prompt","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"The adapter runs the agent as a subprocess in its own process group, on a deadline, and feeds the prompt on stdin."},{"from":"CodingAgent","to":"AgentAdapter","art":"stream + COMPLETE marker","kind":"build","layer":"work","out":"hands to","in":"receives from","say":"The agent streams its output back; the adapter watches for the completion marker and scrapes token and cost figures from what the CLI reports."},{"from":"PRD","to":"EngineerLoop","art":"next failing story","kind":"build","layer":"feedback","out":"points","in":"targets","say":"The loop points the agent at the highest-priority story not yet marked done."},{"from":"EngineerLoop","to":"PRD","art":"passes flag (a claim)","kind":"build","layer":"feedback","out":"claims done in","in":"is claimed by","say":"The agent marks a story done by setting its flag; that flag is a claim, and after R10.3 the reviewer must confirm it before it counts."},{"from":"Breaker","to":"EngineerLoop","art":"stall verdict","kind":"build","layer":"feedback","out":"halts","in":"is halted by","say":"If several iterations in a row change nothing (same diff, same test signature), the breaker halts the loop instead of leted tests, added skips, lost assertions, and new test files that assert nothing falsifiable."},{"from":"FixturesOracle","to":"MechanicalVerifier","art":"fixture results","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Input and output pairs approved in the PRD are run sandboxed, outside the tree the agent can write, so a gamed test file cannot deselect them."},{"from":"MechanicalVerifier","to":"Findings","art":"check results","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Every failed check becomes a typed finding with a file, a line and a fix hint; a check that could not run leaves a finding saying so."},{"from":"MechanicalVerifier","to":"FailureParsers","art":"raw tool output","kind":"measure","layer":"measure","out":"hands output to","in":"parses for","say":"Each failed check's stdout and stderr go to the parsers, which recover the file, the line and the message and attach a hint."},{"from":"FailureParsers","to":"Findings","art":"structured failures","kind":"measure","layer":"measure","out":"shapes into","in":"is shaped by","say":"A parsed failure becomes a typed finding with a location and a suggestion; unparseable output still becomes a finding, without them."},{"from":"Reviewer","to":"Findings","art":"criterion verdicts + concerns","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Each acceptance criterion gets a verdict, and each concern beyond the criteria (scope creep, weak tests, dead code) becomes a finding."},{"from":"SecurityReviewer","to":"Findings","art":"vulnerability findings","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"Each vulnerability found becomes a finding mapped to an OWASP category, with severity."},{"from":"Findings","to":"Pipeline","art":"the error signal","kind":"decide","layer":"feedback","out":"decides","in":"reads","say":"The findings are the error signal: the pipeline reads them, not the agent's summary, to decide whether the component passed."},{"from":"Pipeline","to":"RetryContext","art":"retry","kind":"decide","layer":"feedback","out":"feeds back to","in":"is fed by","say":"When a gate fails and retries remain, the pipeline writes the findings into the context the next attempt will receive."},{"from":"Pipeline","to":"Distiller","art":"passed diff","kind":"ship","layer":"work","out":"hands to","in":"receives from","say":"Once every gate has passed and before the merge, the diff goes to the distiller so what was learned is captured while it is still the true delta."},{"from":"Distiller","to":"KnowledgeInjector","art":"durable facts","kind":"learn","layer":"learn","out":"writes facts for","in":"reads facts from","say":"Durable facts about the built artifact are written to disk and picked up by later components' prompts; how often they are used is measured."},{"from":"Pipeline","to":"PullRequests","art":"merge","kind":"ship","layer":"work","out":"hands to","in":"receives from","say":"A component that passed every gate is pushed, opened as a pull request and merged; it counts as complete only when the merge is confirmed."},{"from":"PullRequests","to":"GitHubPRs","art":"pull request","kind":"ship","layer":"operator","out":"asks","in":"is steered by","say":"One pull request per component, with the findings in its body, is the factory's output; a human can read every decision there."},{"from":"PullRequests","to":"ContractTester","art":"merged tiers","kind":"measure","layer":"measure","out":"measures","in":"is measured by","say":"After components merge, the integration tests run on the merged tiers of the dependency graph."},{"from":"ContractTester","to":"Scheduler","art":"breaker component to reset","kind":"decide","layer":"feedback","out":"resets via","in":"re-runs for","say":"A failing tier is attributed to the most recently merged component, which the scheduler resets and re-runs against the fresh base."},{"from":"Pipeline","to":"Inbox","art":"checkpoint / policy ":"AutonomyLadder","art":"violation -> demotion","kind":"trust","layer":"trust","out":"demotes","in":"is demoted by","say":"A policy violation demotes the factory one level automatically; there is no appeal at run time."},{"from":"Calibration","to":"AutonomyLadder","art":"regression (R10.11)","kind":"trust","layer":"trust","out":"can demote","in":"watches","say":"A regression in the reviewers' measured detection rate opens a decision for you and, behind a switch, demotes (R10.11)."},{"from":"AutonomyLadder","to":"StateDir","art":"autonomy.json","kind":"trust","layer":"trust","out":"is kept in","in":"keeps","say":"The level and its history live in the control directory outside the repository, so the agent it governs cannot edit its own governor."},{"from":"SpendLedger","to":"StateDir","art":"spend.json","kind":"trust","layer":"trust","out":"is kept in","in":"keeps","say":"Daily spend is kept outside the tree too, rewritten whole under a lock, and refused rather than guessed when unreadable."},{"from":"Inbox","to":"StateDir","art":"inbox.jsonl","kind":"trust","layer":"trust","out":"is kept in","in":"keeps","say":"The decisions waiting for you are stored outside the tree; an inbox the agent could edit would not be yours."},{"from":"Scheduler","to":"EvolutionJournal","art":"component outcomes + signatures","kind":"learn","layer":"learn","out":"teaches","in":"learns from","say":"Every component's outcome, failure signature, cost and finding summary is appended to the journal after the run."},{"from":"EvolutionJournal","to":"Proposals","art":"recurring patterns","kind":"learn","layer":"learn","out":"teaches","in":"learns from","say":"Patterns that recur across runs become proposals written for you to read; today nothing reads a proposal back into a run."},{"from":"EvolutionJournal","to":"Replay","art":"experiments.tsv","kind":"trust","layer":"trust","out":"governs","in":"is governed by","say":"The recorded runs are what the replay tool feeds through the ladder's thresholds to say what would have fired, without changing anything."},{"from":"Pipeline","to":"EventBus","art":"typed events","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"Every phase start, verdict, retry and finding is emitted as a typed event; the event is the record, and sinks may not change control flow."},{"from":"Scheduler","to":"EventBus","art":"typed events","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"Run start, component scheduling, budget and completion are emitted as typed events alongside the pipeline's."},{"from":"EventBus","to":"ProgressLog","art":"v1 mirror","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"The older progress log is still written, byte-compatible, for anything that reads it."},{"from":"EventBus","to":"Reducer","art":"events.jsonl","kind":"observe","layer":"record","out":"is folded by","in":"folds","say":"The reducer folds the event file into the current state of the run; anything shown anywhere can be rebuilt from that file."},{"from":"Reducer","to":"Dashboard","art":"RunState","kind":"observe","layer":"record","out":"drives","in":"renders","say":"The terminal dashboard renders the reduced state live, attaches to a run from another terminal, and replays a finished one."},{"from":"Reducer","to":"CLI","art":"ks status","kind":"observe","layer":"record","out":"records to","in":"is rebuilt from","say":"ks status prints the same reduced state for scripts and CI, with lower-bound markers wherever a cost figure is unreported."},{"from":"EventBus","to":"LinearMirror","art":"failures, budget halts","kind":"observe","layer":"record","out":"mirrors to","in":"mirrors","say":"Failures and budget halts are mirrored to the tracker as comments; the mirror is outbound only and can never fail a run."},{"from":"Dashboard","to":"Operator","art":"board, checkpoint modal","kind":"observe","layer":"operator","out":"shows","in":"watches","say":"You watch the nt of the agent, after the codebase context and before your standing instructions."},{"acts":["EngineerLoop"],"measures":["Breaker"],"edge":21,"say":"If the attempt changes nothing, the stall detector halts it rather than spending the rest of the budget."}]},{"id":"operator-steers","label":"You steer the factory","steps":[{"acts":["Operator","Architect"],"measures":[],"edge":6,"say":"You write the spec and, when the planner halts on a blocker, you fix the spec; there is no override flag."},{"acts":["Dashboard","Operator"],"measures":[],"edge":65,"say":"You watch the board, drill into a component, and read the findings beside the transcript."},{"acts":["Pipeline","HumanCheckpoint"],"measures":[],"edge":45,"say":"With the checkpoint on, the factory stops before each merge and shows you the diff, the findings and the cost; you approve, reject or spend a retry."},{"acts":["Pipeline","Inbox","Operator"],"measures":[],"edge":66,"say":"Decisions the factory may not take alone wait for you in one place; you approve, reject, retry or snooze."},{"acts":["Operator","AutonomyLadder"],"measures":[],"edge":67,"say":"You promote the factory only with evidence and an acknowledgement; it demotes itself without asking."},{"acts":["OperatorContext","Steering"],"measures":[],"edge":13,"say":"Planned: your golden patterns and standing corrections are read on every run, and a comment on a pull request appends to them (R10.8 to R10.10)."}]},{"id":"trust-earned-lost","label":"The factory earns and loses autonomy","steps":[{"acts":["Scheduler","AutonomyLadder"],"measures":[],"edge":48,"say":"Every decisive run adds evidence at the current level: merged components, clean merges, violations."},{"acts":["Operator","AutonomyLadder"],"measures":[],"edge":67,"say":"When the evidence meets the level's entry criteria, you promote with an acknowledgement; the ladder never promotes itself."},{"acts":["AutonomyLadder","Pipeline"],"measures":[],"edge":49,"say":"At the next run start the level becomes a   return {x:+r.getAttribute('x'), y:+r.getAttribute('y'),
    w:+r.getAttribute('width'), h:+r.getAttribute('height')};
}
function el(name, attrs, text){
  var e = document.createElementNS(NS, name);
  for(var k in attrs){ if(attrs.hasOwnProperty(k)){ e.setAttribute(k, attrs[k]); } }
  if(text !== undefined){ e.textContent = text; }
  return e;
}

// ---- the viewport ---------------------------------------------------------
// The drawing sits in <g class="view" transform="translate(tx ty) scale(k)">.
// (tx, ty, k) are in viewBox units, so a drawing point p lands at k*p + t in
// the viewBox and every box or path read from the figure stays in drawing
// units. `base` is the CSS pixels the browser gives one viewBox unit; the
// zoom the reader sees is base*k, and Fit (the whole map across the column)
// is k = 1, t = 0. Wheel and pinch zoom about the pointer, a drag pans, a
// selection or a journey step frames its neighbourhood, and Escape (in the
// page around this script) returns to the view before the framing began.
var view = svg.querySelector('.view');
var VB = svg.viewBox.baseVal;
var ZMIN = 0.4, ZMAX = 2.5, ZCAP = 1.4, FRAME_PAD = 28, ANIM_MS = 320;
var cur = {k:1, tx:0, ty:0};   // what is drawn now, mid-animation included
var goal = {k:1, tx:0, ty:0};  // where the view is heading
var saved = null;              // the view before the current framing chain
var framed = false;            // the view on screen is one a frame() set
var anim = 0, booted = false, dragged = false;
function base(){ var m = svg.getScreenCTM(); return m && m.a ? m.a : 1; }
function reduced(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function isFit(v){
  v = v || goal;
  return Math.abs(v.k - 1) < 1e-3 && Math.abs(v.tx) < 0.5 && Math.abs(v.ty) < 0.5;
}
function centre(){ return {x:VB.x + VB.width / 2, y:VB.y + VB.height / 2}; }
function toVb(clientX, clientY){
  // A client point in viewBox units.
  var m = svg.getScreenCTM();
  if(!m){ return centre(); }
  var q = new DOMPoint(clientX, clientY).matrixTransform(m.inverse());
  return {x:q.x, y:q.y};
}
function clampView(v){
  // The zoom stays between ZMIN and ZMAX (Fit is always allowed, even on a
  // column so narrow that Fit is under ZMIN), and a fifth of the viewport
  // always holds drawing, so the map cannot be dragged out of sight.
  var b = base(), lo = Math.min(ZMIN, b) / b, hi = ZMAX / b;
  var k = Math.min(hi, Math.max(lo, v.k));
  var mx = VB.width * 0.2, my = VB.height * 0.2;
  var tx = Math.min(VB.x + VB.width - mx - k * VB.x,
    Math.max(VB.x + mx - k * (VB.x + VB.width), v.tx));
  var ty = Math.min(VB.y + VB.height - my - k * VB.y,
    Math.max(VB.y + my - k * (VB.y + VB.height), v.ty));
  return {k:k, tx:tx, ty:ty};
}
function apply(v){
  cur = v;
  if(view){
    view.setAttribute('transform', 'translate(' + v.tx.toFixed(2) + ' ' + v.ty.toFixed(2)
      + ') scale(' + v.k.toFixed(4) + ')');
  }
  svg.dispatchEvent(new CustomEvent('atlas:view',
    {detail:{zoom:base() * v.k, fit:isFit(v)}, bubbles:true}));
}
function setView(v, instant){
  goal = clampView(v);
  if(anim){ cancelAnimationFrame(anim); anim = 0; }
  if(instant || !booted || reduced()){ apply(goal); return; }
  var from = cur, to = goal, t0 = 0;
  function tick(now){
    if(!t0){ t0 = now; }
    var u = Math.min(1, (now - t0) / ANIM_MS);
    var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    apply({k:from.k + (to.k - from.k) * e, tx:from.tx + (to.tx - from.tx) * e,
      ty:from.ty + (to.ty - from.ty) * e});
    anim = u < 1 ? requestAnimationFrame(tick) : 0;
  }
  anim = requestAnimationFrame(tick);
}
function userView(v, instant){
  // The reader moved the view: it is theirs now, and there is nothing to
  // go back to until the next framing.
  framed = false; saved = null;
  setView(v, instant);
}
function zoomAt(f, cx, cy, instant){
  // Zoom by f about the viewBox point (cx, cy): the drawing point under it
  // stays under it, even when the zoom is clamped.
  var k = clampView({k:goal.k * f, tx:goal.tx, ty:goal.ty}).k, g = k / goal.k;
  userView({k:k, tx:cx - g * (cx - goal.tx), ty:cy - g * (cy - goal.ty)}, instant);
}
function frameRect(r, inset, instant){
  // Fit the drawing rect r into the viewport minus inset {left, right, top,
  // bottom} CSS pixels, at the largest zoom that shows all of it, capped at
  // ZCAP. The first framing in a chain remembers the view it left.
  inset = inset || {};
  var b = base();
  var il = (inset.left || 0) / b, ir = (inset.right || 0) / b;
  var it = (inset.top || 0) / b, ib = (inset.bottom || 0) / b;
  var aw = Math.max(40, VB.width - il - ir), ah = Math.max(40, VB.height - it - ib);
  var k = Math.min(ZCAP / b, aw / r.w, ah / r.h);
  var cx = VB.x + il + aw / 2, cy = VB.y + it + ah / 2;
  if(!framed){ saved = goal; framed = true; }
  setView({k:k, tx:cx - k * (r.x + r.w / 2), ty:cy - k * (r.y + r.h / 2)}, instant);
}
function unionBox(ids, edgeIdx){
  // The rect around some cards and the edges between them, in drawing units.
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  function add(x, y, w, h){
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h);
  }
  ids.forEach(function(id){
    if(nodeOf[id]){ var b = boxOf(nodeOf[id]); add(b.x, b.y, b.w, b.h); } });
  (edgeIdx || []).forEach(function(i){
    var p = flowOf[i];
    if(!p || !p.getBBox){ return; }
    var bb = p.getBBox();
    if(bb.width || bb.height){ add(bb.x, bb.y, bb.width, bb.height); }
  });
  if(x0 === Infinity){ return null; }
  return {x:x0 - FRAME_PAD, y:y0 - FRAME_PAD, w:x1 - x0 + 2 * FRAME_PAD, h:y1 - y0 + 2 * FRAME_PAD};
}
function frameFocus(inset, instant){
  // The selected component, every neighbour, and the edges between them.
  var f = state.focus;
  if(!f || !DETAIL[f]){ return; }
  var ids = [f], edges = DETAIL[f].edges || [];
  edges.forEach(function(i){ ids.push(EDGES[i].from); ids.push(EDGES[i].to); });
  var r = unionBox(ids, edges);
  if(r){ frameRect(r, inset, instant); }
}
function frameJourney(step, instant){
  // The step's acting and measuring components and the edge it traces.
  var ids = (step.acts || []).concat(step.measures || []), edges = [];
  if(step.edge >= 0 && EDGES[step.edge]){
    ids.push(EDGES[step.edge].from); ids.push(EDGES[step.edge].to); edges.push(step.edge);
  }
  var r = unionBox(ids, edges);
  if(r){ frameRect(r, null, instant); }
}
function frameRegion(id){
  var box = null;
  (META.regions || []).forEach(function(z){ if(z.id === id && z.box){ box = z.box; } });
  if(!box){ return; }
  frameRect({x:box[0] - 12, y:box[1] - 12, w:box[2] + 24, h:box[3] + 24}, null);
}
function back(){
  // The view before the framing chain began; nothing if the reader has
  // moved the view since.
  if(!saved){ return; }
  var v = saved;
  saved = null; framed = false;
  setView(v);
}
function fracOf(id){
  // Where the card's centre sits across the viewport, 0 to 1, once the view
  // arrives. The page docks its drawer on the other side.
  var n = nodeOf[id];
  if(!n){ return 0.5; }
  var b = boxOf(n);
  return (goal.k * (b.x + b.w / 2) + goal.tx - VB.x) / VB.width;
}

// Wheel (and trackpad pinch, which arrives as ctrl+wheel) zooms about the
// pointer. A drag pans; under 4px of movement it is a click and the cards
// keep it. Two touches pinch.
svg.addEventListener('wheel', function(e){
  e.preventDefault();
  var d = e.deltaY;
  if(e.deltaMode === 1){ d *= 16; } else if(e.deltaMode === 2){ d *= 400; }
  var f = Math.max(0.5, Math.min(2, Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0022))));
  var c = toVb(e.clientX, e.clientY);
  zoomAt(f, c.x, c.y, true);
}, {passive:false});
var ptrs = {}, drag = null, pinch = null;
function ptrList(){ return Object.keys(ptrs).map(function(k){ return ptrs[k]; }); }
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function startDrag(p){ drag = {x:p.x, y:p.y, tx:goal.tx, ty:goal.ty, moved:false}; }
svg.addEventListener('pointerdown', function(e){
  if(e.pointerType === 'mouse' && e.button !== 0){ return; }
  dragged = false;
  ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
  var list = ptrList();
  if(list.length === 1){ pinch = null; startDrag(list[0]); }
  else if(list.length === 2){
    drag = null;
    var m = toVb((list[0].x + list[1].x) / 2, (list[0].y + list[1].y) / 2);
    pinch = {d:dist(list[0], list[1]), k:goal.k,
      px:(m.x - goal.tx) / goal.k, py:(m.y - goal.ty) / goal.k};
  }
});
svg.addEventListener('pointermove', function(e){
  if(!ptrs[e.pointerId]){ return; }
  ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
  var list = ptrList();
  if(pinch && list.length >= 2){
    var m = toVb((list[0].x + list[1].x) / 2, (list[0].y + list[1].y) / 2);
    var k = clampView({k:pinch.k * dist(list[0], list[1]) / pinch.d, tx:0, ty:0}).k;
    dragged = true;
    userView({k:k, tx:m.x - k * pinch.px, ty:m.y - k * pinch.py}, true);
  } else if(drag){
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!drag.moved){
      if(Math.hypot(dx, dy) < 4){ return; }
      drag.moved = true;
      svg.classList.add('panning');
      if(svg.setPointerCapture){ try { svg.setPointerCapture(e.pointerId); } catch(_x){} }
    }
    var b = base();
    userView({k:goal.k, tx:drag.tx + dx / b, ty:drag.ty + dy / b}, true);
  }
});
function endPointer(e){
  if(!ptrs[e.pointerId]){ return; }
  delete ptrs[e.pointerId];
  if(drag && drag.moved){ dragged = true; }
  drag = null; pinch = null;
  svg.classList.remove('panning');
  var list = ptrList();
  if(list.length === 1){ startDrag(list[0]); drag.moved = true; }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
// A click that ends a drag is not a click: nothing under the pointer hears it.
svg.addEventListener('click', function(e){
  if(dragged){ dragged = false; e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
Array.prototype.slice.call(svg.querySelectorAll('[data-zone]')).forEach(function(z){
  z.addEventListener('dblclick', function(e){ e.preventDefault(); frameRegion(z.dataset.zone); });
});

function paint(){
  var f = state.focus, j = state.journey, L = state.layer;
  var near = {}, hot = {};
  if(f && DETAIL[f]){
    near[f] = true;
    (DETAIL[f].edges || []).forEach(function(i){
      var e = EDGES[i]; hot[i] = true; near[e.from] = true; near[e.to] = true; });
  }
  var jset = {}, traced = -1;
  if(j){
    (j.acts || []).concat(j.measures || []).forEach(function(id){ jset[id] = true; });
    traced = j.edge;
    if(traced >= 0){ jset[EDGES[traced].from] = true; jset[EDGES[traced].to] = true; }
  }
  var inLayer = {};
  EDGES.forEach(function(e){
    if(L === 'all' || e.layer === L){ inLayer[e.from] = true; inLayer[e.to] = true; } });
  flows.forEach(function(p){
    var i = +p.dataset.edge, e = EDGES[i];
    var on = L === 'all' || e.layer === L;
    var lit = !!hot[i] || i === traced;
    var vis = on || lit;
    var dim = vis && !lit && (!!f || !!j);
    var m = {off:!vis, hot:lit, dim:dim, peek:(i === state.peek)};
    setCls(p, m);
    if(labelOf[i]){ setCls(labelOf[i], m); }
  });
  nodes.forEach(function(n){
    var id = n.dataset.id;
    var dim = f ? !near[id] : (j ? !jset[id] : false);
    var quiet = !f && !j && L !== 'all' && !inLayer[id];
    setCls(n, {sel:(id === f), dim:dim, quiet:quiet,
      acts:!!(j && (j.acts || []).indexOf(id) >= 0),
      meas:!!(j && (j.measures || []).indexOf(id) >= 0), tagged:false});
  });
  svg.classList.toggle('endstate', state.endstate);
  svg.classList.toggle('focused', !!f);
  drawTags();
}

function verbsFrom(cid, other){
  // The verbs on the edges between cid and other, read from cid, with the
  // layer colour of the first.
  var out = [], colour = '';
  (DETAIL[cid].edges || []).forEach(function(i){
    var e = EDGES[i];
    if(e.from === cid && e.to === other){ out.push(e.out); }
    else if(e.to === cid && e.from === other){ out.push(e['in']); }
    else { return; }
    colour = colour || LCOL[e.layer];
  });
  return {verbs:out, colour:colour || PAL.ink};
}

function drawTags(){
  if(!tags){ return; }
  while(tags.firstChild){ tags.removeChild(tags.firstChild); }
  var f = state.focus;
  if(!f || !DETAIL[f]){ return; }
  var seen = {};
  (DETAIL[f].edges || []).forEach(function(i){
    var e = EDGES[i];
    var other = e.from === f ? e.to : e.from;
    if(other === f || seen[other] || !nodeOf[other]){ return; }
    seen[other] = true;
    var v = verbsFrom(f, other);
    var text = v.verbs.join(' / ');
    var lines = text.length > 25 ? v.verbs : [text];
    var b = boxOf(nodeOf[other]);
    var th = lines.length > 1 ? 29 : 17;
    var g = el('g', {'class':'vtag', 'data-id':other});
    g.appendChild(el('rect', {x:b.x + 5, y:b.y + b.h - th - 3, width:b.w - 10, height:th, rx:3,
      fill:mix(PAL.raised, v.colour, 0.16), stroke:v.colour}));
    lines.forEach(function(line, k){
      var y = b.y + b.h - 8 - (lines.length - 1 - k) * 12;
      g.appendChild(el('text', {x:b.x + b.w / 2, y:y, fill:v.colour}, line));
    });
    tags.appendChild(g);
    nodeOf[other].classList.add('tagged');
  });
}

// ---- the relationship wheel --------------------------------------------
function wrapName(id){
  var parts = id.match(/[A-Z]+[a-z0-9]*|[a-z0-9]+/g) || [id];
  var lines = [], cur = '';
  parts.forEach(function(p){
    if(cur && (cur + p).length > 10){ lines.push(cur); cur = p; } else { cur += p; }
  });
  if(cur){ lines.push(cur); }
  return lines.slice(0, 3);
}
function wheelLayout(cid){
  // Spokes grouped by layer in LAYERS order, clockwise from the top, with a
  // half-slot of daylight between groups. Mirrored in check_layout.py.
  var d = DETAIL[cid];
  var idx = (d.edges || []).slice();
  idx.sort(function(a, b){ return (LORD[EDGES[a].layer] - LORD[EDGES[b].layer]) || (a - b); });
  var groups = 0, prev = null;
  idx.forEach(function(i){ if(EDGES[i].layer !== prev){ groups++; prev = EDGES[i].layer; } });
  var gap = groups > 1 ? 0.5 : 0;
  var step = 360 / (idx.length + gap * groups);
  var W = 400, H = 400, cx = 200, cy = 200, R = 118;
  var hw = Math.max(34, cid.length * 3.7 + 12), hh = 15;
  var spokes = [], a = -90; prev = null;
  idx.forEach(function(i){
    var e = EDGES[i];
    if(prev !== null && e.layer !== prev){ a += gap * step; }
    prev = e.layer;
    var th = a * Math.PI / 180; a += step;
    var ux = Math.cos(th), uy = Math.sin(th);
    var r0 = Math.min(hw / Math.max(Math.abs(ux), 1e-6), hh / Math.max(Math.abs(uy), 1e-6)) + 8;
    var other = e.from === cid ? e.to : e.from;
    var deg = th * 180 / Math.PI;
    spokes.push({i:i, e:e, other:other, out:(e.from === cid), ux:ux, uy:uy, r0:r0,
      deg:deg, verb:(e.from === cid ? e.out : e['in']), colour:LCOL[e.layer],
      lines:wrapName(other)});
  });
  return {W:W, H:H, cx:cx, cy:cy, R:R, hw:hw, hh:hh, spokes:spokes};
}
function wheelExtent(w){
  // The box the wheel actually occupies: the centre, plus every name label,
  // estimated at 6.6px per glyph. The viewBox is fitted to it so a component
  // with one spoke does not sit in a square of dead space.
  var x0 = w.cx - w.hw, y0 = w.cy - w.hh, x1 = w.cx + w.hw, y1 = w.cy + w.hh;
  w.spokes.forEach(function(s){
    var ex = w.cx + (w.R + 9) * s.ux, ey = w.cy + (w.R + 9) * s.uy;
    var n = s.lines.length, lw = 0;
    s.lines.forEach(function(l){ lw = Math.max(lw, l.length * 6.6); });
    var left, top;
    if(Math.abs(s.ux) < 0.35){
      left = ex - lw / 2; top = (s.uy < 0 ? ey - 4 - (n - 1) * 13 : ey + 12) - 10;
    } else {
      left = s.ux > 0 ? ex + 2 : ex - 2 - lw; top = ey + 4 - (n - 1) * 6.5 - 10;
    }
    x0 = Math.min(x0, left); y0 = Math.min(y0, top);
    x1 = Math.max(x1, left + lw); y1 = Math.max(y1, top + n * 13);
  });
  var pad = 8;
  if(!w.spokes.length){ x0 = w.cx - 100; x1 = w.cx + 100; y0 = w.cy - 44; }
  return {x:x0 - pad, y:y0 - pad, w:x1 - x0 + 2 * pad, h:y1 - y0 + 2 * pad};
}
function wheelSvg(cid){
  var w = wheelLayout(cid);
  var box = wheelExtent(w);
  var h = '<svg viewBox="' + box.x.toFixed(1) + ' ' + box.y.toFixed(1) + ' ' + box.w.toFixed(1)
        + ' ' + box.h.toFixed(1) + '" style="max-width:' + box.w.toFixed(0) + 'px" role="img" '
        + 'aria-label="relationship wheel of ' + esc(cid) + '">';
  h += '<defs>';
  LAYERS.forEach(function(l){
    h += '<marker id="wm-' + esc(l.id) + '" viewBox="0 0 8 8" refX="7" refY="4" '
       + 'markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" '
       + 'orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="' + l.colour
       + '"/></marker>';
  });
  h += '</defs>';
  if(!w.spokes.length){
    h += '<text class="atlas-w__empty" x="' + w.cx + '" y="' + (w.cy - 30) + '">'
       + 'no flow touches this yet</text>';
  }
  w.spokes.forEach(function(s){
    var x0 = w.cx + s.r0 * s.ux, y0 = w.cy + s.r0 * s.uy;
    var x1 = w.cx + w.R * s.ux, y1 = w.cy + w.R * s.uy;
    var rm = (s.r0 + w.R) / 2, mx = w.cx + rm * s.ux, my = w.cy + rm * s.uy;
    var rot = s.ux < 0 ? s.deg + 180 : s.deg;
    var marker = (s.out ? ' marker-end' : ' marker-start') + '="url(#wm-' + esc(s.e.layer) + ')"';
    var ends = ' x1="' + x0.toFixed(1) + '" y1="' + y0.toFixed(1) + '" x2="' + x1.toFixed(1)
             + '" y2="' + y1.toFixed(1) + '"';
    h += '<g class="atlas-w__spoke" data-edge="' + s.i + '" data-go="' + esc(s.other)
       + '" tabindex="0" role="button" aria-label="'
       + esc(cid + ' ' + s.verb + ' ' + s.other) + '">';
    h += '<line class="atlas-w__hit"' + ends + '/>';
    h += '<line class="atlas-w__line"' + ends + ' stroke="' + s.colour + '"' + marker + '/>';
    h += '<text class="atlas-w__verb" x="' + mx.toFixed(1) + '" y="' + (my + 4).toFixed(1)
       + '" fill="' + s.colour + '" transform="rotate(' + rot.toFixed(1) + ' ' + mx.toFixed(1)
       + ' ' + my.toFixed(1) + ')">' + esc(s.verb) + '</text>';
    var ex = w.cx + (w.R + 9) * s.ux, ey = w.cy + (w.R + 9) * s.uy;
    var n = s.lines.length, anchor, lx, first;
    if(Math.abs(s.ux) < 0.35){
      anchor = 'middle'; lx = ex;
      first = s.uy < 0 ? ey - 4 - (n - 1) * 13 : ey + 12;
    } else {
      anchor = s.ux > 0 ? 'start' : 'end'; lx = ex + (s.ux > 0 ? 2 : -2);
      first = ey + 4 - (n - 1) * 6.5;
    }
    h += '<text class="atlas-w__name" text-anchor="' + anchor + '">';
    s.lines.forEach(function(line, k){
      h += '<tspan x="' + lx.toFixed(1) + '" y="' + (first + k * 13).toFixed(1) + '">'
         + esc(line) + '</tspan>';
    });
    h += '</text></g>';
  });
  h += '<g class="atlas-w__centre"><rect x="' + (w.cx - w.hw) + '" y="' + (w.cy - w.hh)
     + '" width="' + (2 * w.hw) + '" height="' + (2 * w.hh) + '" rx="5"/>';
  h += '<text x="' + w.cx + '" y="' + (w.cy + 4) + '">' + esc(cid) + '</text></g>';
  h += '</svg>';
  return h;
}

// ---- the panel -----------------------------------------------------------
var SAY_HINT = 'Hover or tap a spoke, or a neighbour on the map, to read what the relationship is.';
function describe(d){
  var h = '<div class="atlas-f">';
  h += '<h3 class="atlas-f__plain">' + esc(d.plain || d.id) + '</h3>';
  h += '<div class="atlas-f__code">' + esc(d.id) + '<span class="atlas-f__kind">' + esc(d.kind)
     + (d.region ? ' in ' + esc(d.region) : '') + '</span></div>';
  h += '<p class="atlas-f__does">' + esc(d.does) + '</p>';
  h += '<div class="atlas-f__wheel">' + wheelSvg(d.id) + '</div>';
  var say = (d.edges && d.edges.length) ? SAY_HINT : 'Nothing flows to or from this yet.';
