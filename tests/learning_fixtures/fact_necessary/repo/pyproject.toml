[project]
name = "ledgerlite"
version = "0.1.0"
description = "A small in-memory ledger library."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 100
