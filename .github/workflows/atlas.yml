name: Atlas

# The system atlas under docs/atlas is generated from the code and the
# logical model. It is committed so the page can be served as-is and so the
# diff between two commits of atlas.json records what changed about the
# system. This job fails when the committed atlas no longer matches the tree
# or the renderer; the fix is one command, named in the failure.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, set once at the top so every job inherits it. Nothing here
# writes to the repo: the jobs check out, run pytest and the lint gates, and
# move coverage between jobs. actions/upload-artifact and download-artifact
# authenticate with the Actions runtime token, not GITHUB_TOKEN, so read is
# enough. A job that ever needs write asks for it in its own permissions block.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. The spine tier's "origin" is a
          # local bare repo under the test's tmp dir, so the checkout token
          # has no job to do and does not belong in .git/config, where a
          # later step or an uploaded artifact could read it back out.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: atlas.json matches the tree
        run: |
          uv run python scripts/atlas/extract_atlas.py --check || {
            echo "::error title=Atlas is stale::docs/atlas/atlas.json no longer describes the tree. Run scripts/atlas/refresh.sh and commit docs/atlas/."
            exit 1
          }

      - name: layout and meaning tables are consistent
        run: |
          uv run python scripts/atlas/check_layout.py || {
            echo "::error title=Atlas layout::scripts/atlas/logical_model.py or relations.py contradicts itself; see the lines above."
            exit 1
          }

      - name: index.html matches the renderer
        run: |
          uv run python scripts/atlas/render_html.py --check || {
            echo "::error title=Atlas is stale::docs/atlas/index.html differs from what render_html.py renders. Run scripts/atlas/refresh.sh and commit docs/atlas/."
            exit 1
          }

      - name: figures match the generator
        run: |
          uv run python scripts/atlas/figures.py --check || {
            echo "::error title=Figures are stale::docs/atlas/figures/ differs from what figures.py generates. Run scripts/atlas/refresh.sh and commit docs/atlas/."
            exit 1
          }
      - name: lessons index matches the register
        run: |
          uv run python scripts/atlas/lessons_index.py --check || {
            echo "::error title=Lessons index is stale::docs/lessons/index.html differs from what lessons_index.py renders from docs/lessons/register.md. Run scripts/atlas/refresh.sh and commit docs/lessons/index.html."
            exit 1
          }
